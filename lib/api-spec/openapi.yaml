openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /catalog/mnd/{filename}:
    get:
      operationId: getMndDesignImage
      tags: [catalog]
      summary: Serve an imported Modern Nature Design Nepal rug image
      parameters:
        - in: path
          name: filename
          required: true
          schema:
            type: string
            pattern: '^mnd-rug-[0-9]{3}(-thumb)?\.webp$'
      responses:
        "200":
          description: Optimized rug image or thumbnail
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Design image not found
        "503":
          description: Image temporarily unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

